name: x-news-bot

# Each run checks for news every 10 minutes for ~5h40m, then starts the
# next run itself, so the bot runs 24/7 without relying on GitHub's cron.
# The schedule below is only a backup that restarts the loop if it ever stops.

on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write   # save state.json
  actions: write    # start the next run

concurrency:
  group: x-news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot every 10 minutes
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SOURCE_ACCOUNTS: ${{ vars.SOURCE_ACCOUNTS || 'Kalshi,Polymarket' }}
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
        run: |
          git config user.name "x-news-bot"
          git config user.email "x-news-bot@users.noreply.github.com"
          LOOPS=34
          for i in $(seq 1 $LOOPS); do
            echo "::group::Check $i/$LOOPS  $(date -u +%H:%M) UTC"
            git pull --rebase --quiet origin main || echo "pull failed"
            python bot.py || echo "bot run failed"
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -q -m "update state [skip ci]"
              git push -q origin HEAD:main || { git pull --rebase -q origin main && git push -q origin HEAD:main; } || echo "push failed"
            fi
            echo "::endgroup::"
            if [ "$i" -lt "$LOOPS" ]; then sleep 600; fi
          done

      - name: Start next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref main
