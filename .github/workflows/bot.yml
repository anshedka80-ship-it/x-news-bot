name: x-news-bot

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min (GitHub may delay a few minutes)
  workflow_dispatch:          # "Run workflow" button for manual tests

permissions:
  contents: write             # lets the bot commit state.json

concurrency:
  group: x-news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SOURCE_ACCOUNTS: ${{ vars.SOURCE_ACCOUNTS || 'Kalshi,Polymarket' }}
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
        run: python bot.py

      - name: Save state
        run: |
          git config user.name "x-news-bot"
          git config user.email "x-news-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state [skip ci]" && git push)
